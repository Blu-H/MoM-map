# Publishes the whole map to the gh-pages branch in one deploy (one GitHub Pages build):
# the app and demo pages. Watershed snapshots are loaded from the MoM_Alerts repo. 

name: Update map

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'sub_pages/**'
      - 'data/persistent/**'
      - '.github/actions/**'
      - '.github/workflows/deploy-map.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run at a time: a second push waits for the running deploy instead of racing it to gh-pages
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Remove stale demo pages from gh-pages
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/remove-stale-demo-pages
        with:
          deploy-token: ${{ secrets.DEPLOY_PAT }}

      - name: Build demo pages
        uses: ./.github/actions/build-demo-pages

      - name: Prepare deployment
        run: |
          mkdir -p deploy/assets deploy/css deploy/js deploy/data
          cp index.html                 deploy/index.html
          cp css/styles.css             deploy/css/styles.css
          cp js/*.js                    deploy/js/
          cp assets/*                   deploy/assets/
          cp -r data/persistent         deploy/data/
          for demo in sub_pages/demo_*/; do
            demo="${demo%/}"
            name="$(basename "$demo")"
            if [ -f "$demo/index.html" ]; then
              mkdir -p "deploy/$name"
              cp "$demo/index.html" "deploy/$name/index.html"
            fi
          done
          # The repo's .gitignore without the rule for the demo pages published here
          grep -v -e "^/demo_" .gitignore > deploy/.gitignore || true
          touch deploy/.nojekyll

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          branch: gh-pages
          folder: deploy
          clean: true
